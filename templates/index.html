<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroScope — Crop Disease & Pesticide Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --paper: #F7F5EF;
    --panel: #FBFAF6;
    --ink: #241F18;
    --ink-soft: #5A5346;
    --rule: #D9D3C4;
    --leaf: #2F4B32;
    --leaf-soft: #E8EDE6;
    --ochre: #C97C2B;
    --ochre-soft: #FBF0E1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand svg { flex-shrink: 0; transform: translateY(3px); }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .tagline {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: right;
  }

  .upload-section { margin-bottom: 8px; }
  .field-label {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .dropzone {
    border: 1.5px dashed var(--rule);
    border-radius: 4px;
    background: var(--panel);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .dropzone:hover, .dropzone.has-image { border-color: var(--leaf); }
  .dropzone svg { opacity: 0.55; margin-bottom: 10px; }
  .dropzone p {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .dropzone p strong { color: var(--leaf); font-weight: 500; }
  #imageInput { display: none; }

  #preview {
    max-width: 100%;
    max-height: 260px;
    border-radius: 3px;
    display: none;
  }

  button.primary {
    width: 100%;
    background: var(--leaf);
    color: var(--paper);
    border: none;
    padding: 13px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.15s ease;
  }
  button.primary:hover { background: #24391f; }
  button.primary:disabled { background: var(--rule); cursor: default; }

  #result { margin-top: 40px; }
  .report {
    display: none;
  }
  .report-head {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .report-thumb {
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .disease-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.15;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .confidence-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .confidence-track {
    flex: 1;
    max-width: 140px;
    height: 5px;
    background: var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }
  .confidence-fill {
    height: 100%;
    background: var(--leaf);
    border-radius: 3px;
  }
  .confidence-num {
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .low-confidence {
    background: var(--ochre-soft);
    border-left: 3px solid var(--ochre);
    padding: 12px 14px;
    font-size: 13.5px;
    color: #7A4A16;
    margin: 18px 0;
    border-radius: 0 3px 3px 0;
  }

  .section-rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 24px 0 16px;
  }
  .section-label {
    font-family: 'Work Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--leaf);
    margin: 0 0 10px;
  }
  .symptom-text {
    font-size: 14.5px;
    color: var(--ink);
    margin: 0;
  }
  .steps {
    margin: 0;
    padding-left: 20px;
    font-size: 14.5px;
  }
  .steps li { margin-bottom: 8px; }
  .steps li:last-child { margin-bottom: 0; }

  .chat-section { margin-top: 8px; }
  .chat-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  #chatInput {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    background: var(--panel);
    color: var(--ink);
  }
  #chatInput:focus { outline: 2px solid var(--leaf); outline-offset: 1px; }
  button.ask {
    background: var(--panel);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 0 18px;
    border-radius: 3px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
  button.ask:hover { background: var(--leaf-soft); }

  #chatAnswer {
    margin-top: 14px;
    font-size: 14px;
  }
  #chatAnswer p:first-child { margin-top: 0; }
  #chatAnswer:empty { display: none; }
  .field-note {
    background: var(--panel);
    border-left: 3px solid var(--leaf);
    padding: 12px 14px;
    border-radius: 0 3px 3px 0;
  }

  .status-text { font-size: 13.5px; color: var(--ink-soft); }
  .error-text { font-size: 13.5px; color: #A13A2E; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C12 2 5 6 5 13C5 17.4183 8.13401 21 12 21C15.866 21 19 17.4183 19 13C19 6 12 2 12 2Z" stroke="#2F4B32" stroke-width="1.5"/>
          <path d="M12 21V8" stroke="#2F4B32" stroke-width="1.5"/>
        </svg>
        <h1>AgroScope</h1>
      </div>
      <div class="tagline">Crop disease &amp; pesticide guide</div>
    </header>

    <div class="upload-section">
      <div class="field-label">Upload a leaf photo</div>
      <label class="dropzone" id="dropzone" for="imageInput">
        <div id="dropzoneEmpty">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16" stroke="#5A5346" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M12 15V4M12 4L8 8M12 4L16 8" stroke="#5A5346" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p><strong>Choose a photo</strong> of the affected leaf</p>
        </div>
        <img id="preview" alt="Selected leaf">
      </label>
      <input type="file" id="imageInput" accept="image/*">
      <button class="primary" id="predictBtn" onclick="predict()" disabled>Diagnose leaf</button>
      <p id="statusMsg" class="status-text" style="margin-top:10px;"></p>
    </div>

    <div id="result">
      <div class="report" id="report">
        <div class="report-head">
          <img class="report-thumb" id="reportThumb" alt="">
          <div>
            <p class="disease-name" id="diseaseName"></p>
            <div class="confidence-row">
              <div class="confidence-track"><div class="confidence-fill" id="confidenceFill"></div></div>
              <span class="confidence-num" id="confidenceNum"></span>
            </div>
          </div>
        </div>

        <div id="lowConfidenceBox"></div>

        <hr class="section-rule">
        <p class="section-label">Symptoms</p>
        <p class="symptom-text" id="symptomText"></p>

        <hr class="section-rule">
        <p class="section-label">Recommended pesticide &amp; management</p>
        <ol class="steps" id="stepsList"></ol>

        <hr class="section-rule">
        <div class="chat-section">
          <p class="section-label">Ask about this diagnosis</p>
          <div class="chat-row">
            <input type="text" id="chatInput" placeholder="e.g. Is this safe for nearby plants?">
            <button class="ask" onclick="askQuestion()">Ask</button>
          </div>
          <div id="chatAnswer"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const imageInput = document.getElementById('imageInput');
  const dropzone = document.getElementById('dropzone');
  const dropzoneEmpty = document.getElementById('dropzoneEmpty');
  const preview = document.getElementById('preview');
  const predictBtn = document.getElementById('predictBtn');
  const statusMsg = document.getElementById('statusMsg');
  const report = document.getElementById('report');
  const chatAnswer = document.getElementById('chatAnswer');
  let currentDisease = '';
  let currentImageURL = '';

  imageInput.addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
      currentImageURL = URL.createObjectURL(file);
      preview.src = currentImageURL;
      preview.style.display = 'block';
      dropzoneEmpty.style.display = 'none';
      dropzone.classList.add('has-image');
      predictBtn.disabled = false;
      statusMsg.textContent = '';
      report.style.display = 'none';
      chatAnswer.innerHTML = '';
    }
  });

  function predict() {
    const file = imageInput.files[0];
    if (!file) return;

    predictBtn.disabled = true;
    statusMsg.className = 'status-text';
    statusMsg.textContent = 'Analyzing leaf…';
    report.style.display = 'none';

    const formData = new FormData();
    formData.append('file', file);

    fetch('/predict', { method: 'POST', body: formData })
      .then(response => response.json())
      .then(data => {
        predictBtn.disabled = false;
        if (data.error) {
          statusMsg.className = 'error-text';
          statusMsg.textContent = data.error;
          return;
        }
        statusMsg.textContent = '';
        currentDisease = data.disease;

        document.getElementById('reportThumb').src = currentImageURL;
        document.getElementById('diseaseName').textContent = data.disease.replace(/_/g, ' ').replace(/,/g, ',');
        document.getElementById('confidenceNum').textContent = data.confidence;
        const pct = parseFloat(data.confidence);
        document.getElementById('confidenceFill').style.width = Math.min(pct, 100) + '%';

        const lowBox = document.getElementById('lowConfidenceBox');
        if (data.low_confidence) {
          lowBox.innerHTML = '<div class="low-confidence">This result has lower certainty than usual. Consider a clearer, well-lit photo for a more reliable reading.</div>';
        } else {
          lowBox.innerHTML = '';
        }

        document.getElementById('symptomText').textContent = data.symptoms;

        const stepsList = document.getElementById('stepsList');
        stepsList.innerHTML = data.recommendation_steps.map(s => `<li>${s}</li>`).join('');

        chatAnswer.innerHTML = '';
        document.getElementById('chatInput').value = '';
        report.style.display = 'block';
      })
      .catch(() => {
        predictBtn.disabled = false;
        statusMsg.className = 'error-text';
        statusMsg.textContent = 'Could not reach the server. Please try again.';
      });
  }

  function askQuestion() {
    const input = document.getElementById('chatInput');
    const question = input.value.trim();
    if (!question) return;

    chatAnswer.innerHTML = '<p class="status-text">Thinking…</p>';

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ disease: currentDisease, question: question })
    })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          chatAnswer.innerHTML = `<p class="error-text">${data.error}</p>`;
        } else {
          const html = (typeof marked !== 'undefined') ? marked.parse(data.answer) : data.answer;
          chatAnswer.innerHTML = `<div class="field-note">${html}</div>`;
        }
      })
      .catch(() => {
        chatAnswer.innerHTML = '<p class="error-text">Could not reach the server. Please try again.</p>';
      });
  }
</script>
</body>
                </html>
