<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Disease Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f4f0; text-align: center; padding: 50px; }
        h1 { color: #2e7d32; }
        .container { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="file"], input[type="text"] { margin: 10px 0; width: 90%; padding: 8px; }
        button { background-color: #2e7d32; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1b5e20; }
        #result, #chatSection { margin-top: 20px; font-size: 16px; text-align: left; }
        #result h3 { margin-bottom: 4px; margin-top: 16px; }
        #result ol { padding-left: 20px; margin-top: 6px; }
        #result li { margin-bottom: 6px; }
        img#preview { max-width: 100%; margin-top: 15px; border-radius: 8px; }
        #chatSection { display: none; border-top: 1px solid #ddd; padding-top: 15px; }
        #chatAnswer {
            margin-top: 10px;
            background: #f0f4f0;
            padding: 16px 18px;
            border-radius: 6px;
            line-height: 1.6;
        }
        #chatAnswer h2, #chatAnswer h3 {
            color: #2e7d32;
            margin-top: 16px;
            margin-bottom: 6px;
            font-size: 17px;
        }
        #chatAnswer h2:first-child, #chatAnswer h3:first-child {
            margin-top: 0;
        }
        #chatAnswer p {
            margin-bottom: 12px;
        }
        #chatAnswer ul, #chatAnswer ol {
            padding-left: 20px;
            margin-bottom: 12px;
        }
        #chatAnswer li {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Crop Disease Detection</h1>
        <p>Upload a leaf image to detect the disease</p>
        <input type="file" id="imageInput" accept="image/*">
        <br>
        <img id="preview" style="display:none;">
        <br>
        <button onclick="predict()">Predict</button>
        <div id="result"></div>

        <div id="chatSection">
            <h3>Have a question about this diagnosis?</h3>
            <input type="text" id="chatInput" placeholder="e.g. Is this safe for my other plants?">
            <br>
            <button onclick="askQuestion()">Ask</button>
            <div id="chatAnswer"></div>
        </div>
    </div>
    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');
        const chatSection = document.getElementById('chatSection');
        const chatInput = document.getElementById('chatInput');
        const chatAnswer = document.getElementById('chatAnswer');
        let currentDisease = '';

        function resetResults() {
            resultDiv.innerHTML = '';
            chatSection.style.display = 'none';
            chatInput.value = '';
            chatAnswer.innerHTML = '';
            currentDisease = '';
        }

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
            resetResults();
        });

        function predict() {
            const file = imageInput.files[0];
            if (!file) {
                resultDiv.innerHTML = "<p style='color:red;'>Please select an image first.</p>";
                return;
            }
            resetResults();
            resultDiv.innerHTML = "<p>Analyzing...</p>";
            const formData = new FormData();
            formData.append('file', file);
            fetch('/predict', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    resultDiv.innerHTML = `<p style='color:red;'>${data.error}</p>`;
                } else {
                    currentDisease = data.disease;
                    const stepsHtml = data.recommendation_steps.map(step => `<li>${step}</li>`).join('');
                    resultDiv.innerHTML = `
                        <p><strong>Disease Detected:</strong> ${data.disease}</p>
                        <p><strong>Confidence:</strong> ${data.confidence}</p>
                        <h3>Symptoms</h3>
                        <p>${data.symptoms}</p>
                        <h3>Recommended Pesticide &amp; Management Steps</h3>
                        <ol>${stepsHtml}</ol>
                    `;
                    chatSection.style.display = 'block';
                }
            })
            .catch(err => {
                resultDiv.innerHTML = "<p style='color:red;'>Error connecting to server.</p>";
            });
        }

        function askQuestion() {
            const question = chatInput.value;
            if (!question) return;
            chatAnswer.innerHTML = "<p>Thinking...</p>";
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ disease: currentDisease, question: question })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    chatAnswer.innerHTML = `<p style='color:red;'>${data.error}</p>`;
                } else {
                    chatAnswer.innerHTML = marked.parse(data.answer);
                }
            })
            .catch(err => {
                chatAnswer.innerHTML = "<p style='color:red;'>Error connecting to server.</p>";
            });
        }
    </script>
</body>
    </html>
