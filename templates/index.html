<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Disease Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f0;
            text-align: center;
            padding: 50px 15px;
            margin: 0;
        }

        h1 {
            color: #2e7d32;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input[type="file"],
        input[type="text"] {
            margin: 10px 0;
            width: 90%;
            padding: 8px;
        }

        button {
            background-color: #2e7d32;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        #result,
        #chatSection {
            margin-top: 20px;
            font-size: 16px;
            text-align: left;
        }

        #result h3 {
            margin-bottom: 6px;
            margin-top: 20px;
        }

        #result p {
            line-height: 1.6;
            margin: 8px 0;
        }

        #result ol {
            padding-left: 22px;
            margin-top: 8px;
        }

        #result li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        img#preview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }

        #chatSection {
            display: none;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        /* AI response box */
        #chatAnswer {
            margin-top: 15px;
            background: #f0f4f0;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.7;
            text-align: left;
        }

        /* AI headings */
        #chatAnswer h3 {
            color: #2e7d32;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 18px;
        }

        #chatAnswer h4 {
            color: #2e7d32;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        /* AI paragraphs */
        #chatAnswer p {
            margin: 0 0 12px 0;
            line-height: 1.7;
        }

        /* AI bullet points */
        #chatAnswer ul,
        #chatAnswer ol {
            padding-left: 22px;
            margin: 8px 0 15px 0;
        }

        #chatAnswer li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        /* Bold text */
        #chatAnswer strong {
            color: #222;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌱 Crop Disease Detection</h1>

        <p>Upload a leaf image to detect the disease</p>

        <input type="file" id="imageInput" accept="image/*">

        <br>

        <img id="preview" style="display:none;">

        <br>

        <button onclick="predict()">Predict</button>

        <div id="result"></div>

        <div id="chatSection">

            <h3>Have a question about this diagnosis?</h3>

            <input
                type="text"
                id="chatInput"
                placeholder="e.g. What is a fungicide?"
            >

            <br>

            <button onclick="askQuestion()">Ask</button>

            <div id="chatAnswer"></div>

        </div>

    </div>


    <script>

        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');
        const chatSection = document.getElementById('chatSection');
        const chatAnswer = document.getElementById('chatAnswer');

        let currentDisease = '';


        /* ----------------------------------
           IMAGE PREVIEW
        ---------------------------------- */

        imageInput.addEventListener('change', function() {

            const file = this.files[0];

            if (file) {

                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';

            }

        });


        /* ----------------------------------
           DISEASE PREDICTION
        ---------------------------------- */

        function predict() {

            const file = imageInput.files[0];

            if (!file) {

                resultDiv.innerHTML =
                    "<p style='color:red;'>Please select an image first.</p>";

                return;
            }

            resultDiv.innerHTML = "<p>Analyzing...</p>";

            chatSection.style.display = 'none';

            const formData = new FormData();

            formData.append('file', file);


            fetch('/predict', {
                method: 'POST',
                body: formData
            })

            .then(response => response.json())

            .then(data => {

                if (data.error) {

                    resultDiv.innerHTML =
                        `<p style='color:red;'>${data.error}</p>`;

                } else {

                    currentDisease = data.disease;

                    const stepsHtml =
                        data.recommendation_steps
                        .map(step => `<li>${step}</li>`)
                        .join('');


                    resultDiv.innerHTML = `

                        <p>
                            <strong>Disease Detected:</strong>
                            ${data.disease}
                        </p>

                        <p>
                            <strong>Confidence:</strong>
                            ${data.confidence}
                        </p>

                        <h3>Symptoms</h3>

                        <p>
                            ${data.symptoms}
                        </p>

                        <h3>
                            Recommended Pesticide &amp;
                            Management Steps
                        </h3>

                        <ol>
                            ${stepsHtml}
                        </ol>

                    `;

                    chatSection.style.display = 'block';

                    chatAnswer.innerHTML = '';

                }

            })

            .catch(err => {

                resultDiv.innerHTML =
                    "<p style='color:red;'>Error connecting to server.</p>";

            });

        }


        /* ----------------------------------
           FORMAT AI RESPONSE
        ---------------------------------- */

        function formatAIResponse(text) {

            if (!text) return "";

            /*
             * First escape HTML so that the AI response
             * cannot accidentally inject HTML into your page.
             */

            text = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");


            /*
             * Convert Markdown headings
             */

            text = text.replace(
                /^### (.*)$/gm,
                "<h4>$1</h4>"
            );

            text = text.replace(
                /^## (.*)$/gm,
                "<h3>$1</h3>"
            );


            /*
             * Convert bold text
             */

            text = text.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );


            /*
             * Convert bullet points
             */

            text = text.replace(
                /^\* (.*)$/gm,
                "<li>$1</li>"
            );

            text = text.replace(
                /(<li>.*<\/li>)/gs,
                "<ul>$1</ul>"
            );


            /*
             * Convert numbered lists
             */

            text = text.replace(
                /^\d+\.\s+(.*)$/gm,
                "<li>$1</li>"
            );


            /*
             * Convert line breaks into paragraphs.
             */

            const blocks = text
                .split(/\n\s*\n/)
                .map(block => block.trim())
                .filter(block => block.length > 0);


            return blocks.map(block => {

                if (
                    block.startsWith("<h3>") ||
                    block.startsWith("<h4>") ||
                    block.startsWith("<ul>")
                ) {
                    return block;
                }

                return `<p>${block.replace(/\n/g, "<br>")}</p>`;

            }).join("");

        }


        /* ----------------------------------
           ASK AI QUESTION
        ---------------------------------- */

        function askQuestion() {

            const question =
                document.getElementById('chatInput').value.trim();

            if (!question) return;

            chatAnswer.innerHTML =
                "<p>Thinking...</p>";


            fetch('/chat', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    disease: currentDisease,
                    question: question
                })

            })

            .then(response => response.json())

            .then(data => {

                if (data.error) {

                    chatAnswer.innerHTML =
                        `<p style='color:red;'>${data.error}</p>`;

                } else {

                    /*
                     * Format the AI response properly
                     * instead of putting everything inside
                     * one paragraph.
                     */

                    chatAnswer.innerHTML =
                        formatAIResponse(data.answer);

                }

            })

            .catch(err => {

                chatAnswer.innerHTML =
                    "<p style='color:red;'>Error connecting to server.</p>";

            });

        }

    </script>

</body>
</html>
